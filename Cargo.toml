[package]
name = "zray"
version = "0.1.0"
edition = "2024"

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["bracketed-paste", "use-dev-tty"] }
libc = "0.2.191"
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
unicode-width = "0.2.3"
